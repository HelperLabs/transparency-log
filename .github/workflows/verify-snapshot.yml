name: Verify snapshot signatures
on:
  push:
    paths:
      - "snapshots/**"
      - "anchors/**"
      - "keys.json"
      - ".github/**"
      - "scripts/**"
  pull_request:
    paths:
      - "snapshots/**"
      - "anchors/**"
      - "keys.json"
      - ".github/**"
      - "scripts/**"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node .github/scripts/verify-signatures.mjs
      - run: node scripts/verify-ots.mjs
